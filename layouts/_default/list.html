{{ define "main" }}
<div class="post-list">
  {{ $pag := .Paginate (.Pages.ByDate.Reverse) }}
  {{ range $pag.Pages }}
    <article class="post-card">
      <h2 class="post-title"><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
      <div class="post-meta">
        <time>{{ .Date.Format "2006-01-02" }}</time>
        {{ with .GetTerms "categories" }}<span class="dot">·</span>{{ range . }}<a href="{{ .RelPermalink }}">{{ .Title }}</a>{{ end }}{{ end }}
      </div>
      <div class="post-excerpt">{{ .Summary }}</div>
    </article>
  {{ end }}
</div>
{{ template "_internal/pagination.html" . }}
{{ end }}
