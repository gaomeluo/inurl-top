{{ define "main" }}
<div class="row">
  <div id="main" class="col-mb-12 col-8" role="main">
    <div class="archive-title">{{ .Title }}</div>
    {{ $pag := .Paginate .Pages }}
    {{ range $pag.Pages }}
      {{ partial "post-card.html" . }}
    {{ end }}
    {{ template "_internal/pagination.html" . }}
  </div>
  {{ partial "sidebar.html" . }}
</div>
{{ end }}
