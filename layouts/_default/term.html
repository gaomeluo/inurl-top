{{ define "main" }}
<section class="list">
  <h1>{{ .Title }}</h1>
  <p class="post-meta">分类归档 · 共 {{ len .Pages }} 篇</p>
  <ul class="post-list">
    {{ range .Pages }}
    <li>
      <a href="{{ .RelPermalink }}">{{ .Title }}</a>
      <time>{{ .Date.Format "2006-01-02" }}</time>
    </li>
    {{ end }}
  </ul>
  {{ template "_internal/pagination.html" . }}
</section>
{{ end }}
