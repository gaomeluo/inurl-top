<!DOCTYPE HTML>
<html lang="zh-CN" class="no-js">
<head>
  <meta charset="utf-8">
  <script>document.documentElement.className = 'js';</script>
  <meta http-equiv="X-UA-Compatible" content="IE=edge, chrome=1">
  <meta name="renderer" content="webkit">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="all">
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} - {{ .Site.Title }}{{ end }}</title>
  {{- with .Site.Params.description }}<meta name="description" content="{{ . }}">
  {{- end }}
  <link rel="canonical" href="{{ .Permalink }}">
  <link rel="icon" href="/img/header.jpg" type="image/jpeg">
  <link rel="stylesheet" href="/css/grid.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/hugo-addons.css">
  {{ with .OutputFormats.Get "RSS" }}<link rel="{{ .RelPermalink }}" type="application/rss+xml" title="{{ $.Site.Title }}">{{ end }}
</head>
<body>
<div id="read-progress"></div>

{{ partial "header.html" . }}

<div id="body">
  <div class="container">
    {{ block "main" . }}{{ end }}
  </div>
</div>

{{ partial "footer.html" . }}

<!-- 搜索弹窗（客户端 index.json 检索） -->
<div class="search-modal-mask" id="searchMask" onclick="if(event.target===this)closeSearch()"></div>
<div class="search-modal" id="searchModal">
  <input type="text" id="searchInput" placeholder="输入关键词搜索文章…" />
  <div class="results" id="searchResults"></div>
</div>

<script src="/js/main.js" defer></script>
<script src="/js/search.js" defer></script>
<script async src="//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
{{ block "scripts" . }}{{ end }}
<!-- 全站访问统计（inurl.link tracker，所有页面底部自动加载） -->
<script async src="https://inurl.link/track.js" data-site="7dd51897-5ea2-425d-a2e6-65091efd0cb0"></script>
<script>
  // 全站链接新窗口打开（#锚点与 javascript: 除外）
  document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('a[href]').forEach(function (a) {
      var h = a.getAttribute('href') || '';
      if (h.charAt(0) !== '#' && !h.startsWith('javascript:') && !a.hasAttribute('target')) {
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
      }
    });
  });
  // 阅读量 = 迁移前旧量(views) + 不蒜子新增量
  (function () {
    var pv = document.getElementById('busuanzi_value_page_pv');
    if (!pv) return;
    var base = parseInt(pv.getAttribute('data-base') || '0', 10) || 0;
    if (!base) return;
    var done = false;
    var obs = new MutationObserver(function () {
      if (done) return;
      var cur = parseInt(pv.textContent, 10);
      if (!isNaN(cur)) { pv.textContent = base + cur; done = true; obs.disconnect(); }
    });
    obs.observe(pv, { childList: true, characterData: true, subtree: true });
  })();
</script>
</body>
</html>
