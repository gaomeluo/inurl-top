<!DOCTYPE HTML>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge, chrome=1">
  <meta name="renderer" content="webkit">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="all">
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} - {{ .Site.Title }}{{ end }}</title>
  {{- with .Site.Params.description }}<meta name="description" content="{{ . }}">
  {{- end }}
  <link rel="canonical" href="{{ .Permalink }}">
  <link rel="icon" href="/img/header.jpg" type="image/jpeg">
  <link rel="stylesheet" href="/css/grid.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/hugo-addons.css">
  {{ with .OutputFormats.Get "RSS" }}<link rel="{{ .RelPermalink }}" type="application/rss+xml" title="{{ $.Site.Title }}">{{ end }}
</head>
<body>
<div id="read-progress"></div>

{{ partial "header.html" . }}

<div id="body">
  <div class="container">
    {{ block "main" . }}{{ end }}
  </div>
</div>

{{ partial "footer.html" . }}

<!-- 搜索弹窗（客户端 index.json 检索） -->
<div class="search-modal-mask" id="searchMask" onclick="if(event.target===this)closeSearch()"></div>
<div class="search-modal" id="searchModal">
  <input type="text" id="searchInput" placeholder="输入关键词搜索文章…" />
  <div class="results" id="searchResults"></div>
</div>

<script src="/js/main.js" defer></script>
<script src="/js/search.js" defer></script>
<script async src="//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
{{ block "scripts" . }}{{ end }}
</body>
</html>
