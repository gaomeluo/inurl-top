<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} · {{ .Site.Title }}{{ end }}</title>
  {{ with .Site.Params.description }}<meta name="description" content="{{ . }}">{{ end }}
  <link rel="stylesheet" href="{{ "css/style.css" | relURL }}">
  <link rel="alternate" type="application/rss+xml" href="{{ "index.xml" | absURL }}" title="{{ .Site.Title }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ .Site.BaseURL }}">{{ .Site.Title }}</a>
    <nav class="site-nav">
      {{ range .Site.Menus.main }}
        <a href="{{ .URL }}">{{ .Name }}</a>
      {{ end }}
      <button id="theme-toggle" type="button" aria-label="切换主题">◐</button>
    </nav>
  </header>
  <main class="container">
    {{ block "main" . }}{{ end }}
  </main>
  <footer class="site-footer">
    <p>© {{ now.Year }} {{ .Site.Title }}</p>
  </footer>
  <script>
    (function () {
      var root = document.documentElement;
      var saved = localStorage.getItem("theme");
      if (saved) root.setAttribute("data-theme", saved);
      document.getElementById("theme-toggle").addEventListener("click", function () {
        var cur = root.getAttribute("data-theme");
        var next = (cur === "dark") ? "light" : "dark";
        root.setAttribute("data-theme", next);
        localStorage.setItem("theme", next);
      });
    })();
  </script>
</body>
</html>
