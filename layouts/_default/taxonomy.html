{{ define "main" }}
<section class="list">
  <h1>{{ .Title }}</h1>
  <ul class="post-list">
    {{ range .Data.Terms.Alphabetical }}
    <li>
      <a href="{{ .Page.RelPermalink }}">{{ .Page.Title }}</a>
      <span class="post-meta">{{ .Count }}</span>
    </li>
    {{ end }}
  </ul>
</section>
{{ end }}
