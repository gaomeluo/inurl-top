{{ define "main" }}
<div class="section-title">分类索引<span class="line"></span></div>
<div class="cat-grid">
  {{ range .Site.Taxonomies.categories.Alphabetical }}
    <a class="cat-card reveal" href="{{ .Page.RelPermalink }}">
      <div class="cat-name">{{ .Page.Title }}</div>
      <div class="cat-count">{{ .Count }} 篇文章</div>
    </a>
  {{ end }}
</div>
{{ end }}
