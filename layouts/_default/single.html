{{ define "main" }}
<article class="post">
  <header class="post-header">
    <h1>{{ .Title }}</h1>
    <p class="post-meta">
      <time>{{ .Date.Format "2006-01-02" }}</time>
      {{ with .Params.categories }}<span>· {{ delimit . " / " }}</span>{{ end }}
    </p>
  </header>
  <div class="post-content">
    {{ .Content }}
  </div>
</article>
{{ end }}
