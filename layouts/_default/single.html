{{ define "main" }}
<article class="post">
  <h1 class="post-title-single">{{ .Title }}</h1>
  <div class="post-meta">
    <time>{{ .Date.Format "2006-01-02" }}</time>
    {{ with .GetTerms "categories" }}<span class="dot">·</span>{{ range . }}<a href="{{ .RelPermalink }}">{{ .Title }}</a>{{ end }}{{ end }}
  </div>
  <div class="post-content">
    {{ .Content }}
  </div>
  {{ with .GetTerms "categories" }}<div class="post-tags"><span>分类：</span>{{ range . }}<a class="chip" href="{{ .RelPermalink }}">{{ .Title }}</a>{{ end }}</div>{{ end }}
</article>
{{ end }}
