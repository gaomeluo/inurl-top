{{ define "main" }}
<div class="page-containers">
  <header class="page-bg about-bg"></header>
  <h1 class="page-title hero-title" aria-label="代码如诗·字字珠玑">
    <span class="ch" style="--i:1">代</span><span class="ch" style="--i:2">码</span><span class="ch" style="--i:3">如</span><span class="ch" style="--i:4">诗</span><span class="ch dot" style="--i:5">·</span><span class="ch" style="--i:6">字</span><span class="ch" style="--i:7">字</span><span class="ch" style="--i:8">珠</span><span class="ch" style="--i:9">玑</span>
  </h1>

  <div class="row">
    <div class="post-content" itemprop="articleBody">
      <div id="main" class="col-mb-12 col-8" role="main">
        {{ $pages := where .Site.RegularPages "Section" "posts" }}
        {{ $pag := .Paginate $pages }}
        {{ range $pag.Pages }}
          {{ partial "post-card.html" . }}
        {{ end }}
        {{ partial "pagination.html" . }}
      </div>
      {{ partial "sidebar.html" . }}
    </div>
  </div>
</div>
{{ end }}
