<article class="post shadow index reveal" style="--rd:{{ mod .i 6 | mul 70 }}ms">
  <h2 class="post-title"><a href="{{ .p.RelPermalink }}">{{ .p.Title }}</a></h2>
  <div class="post-content index">{{ $s := .p.Summary | plainify }}{{ substr $s 0 80 }}{{ if gt (len $s) 80 }}…{{ end }}</div>
  <ul class="post-meta index">
    <li>时间: <time datetime="{{ .p.Date.Format "2006-01-02T15:04:05Z07:00" }}">{{ .p.Date.Format "2006-01-02" }}</time></li>
    {{ with .p.GetTerms "categories" }}<li>{{ range . }}<a href="{{ .RelPermalink }}">{{ .Title }}</a> {{ end }}</li>{{ end }}
    <li><a href="{{ .p.RelPermalink }}#comments">评论</a></li>
    <li><a href="{{ .p.RelPermalink }}">阅读全文</a></li>
  </ul>
</article>
