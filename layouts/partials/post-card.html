<article class="post shadow index">
  <h2 class="post-title"><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
  <div class="post-content index">{{ $s := .Summary | plainify }}{{ substr $s 0 80 }}{{ if gt (len $s) 80 }}…{{ end }}</div>
  <ul class="post-meta index">
    <li>时间: <time datetime="{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}">{{ .Date.Format "2006-01-02" }}</time></li>
    {{ with .GetTerms "categories" }}<li>{{ range . }}<a href="{{ .RelPermalink }}">{{ .Title }}</a> {{ end }}</li>{{ end }}
    <li><a href="{{ .RelPermalink }}#comments">评论</a></li>
    <li><a href="{{ .RelPermalink }}">阅读全文</a></li>
  </ul>
</article>
