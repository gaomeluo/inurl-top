# ============================================
# 顶级索引 — Hugo 配置
# 静态生成 + Cloudflare Pages 托管
# 原 Typecho 博客迁移（域名 inurl.top）
# ============================================

baseURL = "https://inurl.top/"
languageCode = "zh-CN"
title = "顶级索引"
defaultContentLanguage = "zh"
summaryLength = 60

# ===== 站点副标题（顶栏/横幅用） =====
[params]
  description = "一个程序猿的折腾记录"

# ===== 永久链接：1:1 还原原 Typecho 结构 =====
[permalinks]
  posts = "/archives/:slug/"   # 文章  → /archives/{slug}/
  pages = "/:slug/"            # 独立页面（content/pages/ 的 section 即 pages）→ /{slug}/
  categories = "/:slug/"      # 分类 term 页（content/categories/<slug>/）→ /{slug}/

# ===== 分类法 =====
[taxonomies]
  category = "categories"

# ===== 分页 =====
[pagination]
  pagerSize = 12

# ===== 输出格式 =====
[outputs]
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML", "RSS"]
  term = ["HTML", "RSS"]

# ===== Markdown 渲染（允许原站 HTML / 图片标签）=====
[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    noClasses = false
    guessSyntax = true
    style = "github"

# ===== 顶部菜单（后续可在 Pages CMS 维护，或在此手写）=====
[menus]
  [[menus.main]]
    name = "首页"
    url = "/"
    weight = 1
