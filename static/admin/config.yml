# ============================================================
# Decap CMS 配置（可视化编辑器：工具栏按钮 + 实时预览）
# 访问地址：https://inurl.top/admin/  （或 https://inurl-top.pages.dev/admin/）
# 首次打开需 GitHub 登录授权（见下方 backend.app_id 说明）
# ============================================================

backend:
  name: github
  repo: gaomeluo/inurl-top
  branch: main
  # ↓↓↓ 已填入用户提供的 GitHub OAuth App Client ID
  app_id: Ov23liJ4fvPrfXbIBSdq
  # 自托管 OAuth：登录走 Cloudflare Pages Functions（functions/auth.js → /auth）
  # 注意：Decap 的 github 后端会把 base_url 同时当成「鉴权前缀」和「GitHub API 基地址」，
  #   → 鉴权走 https://inurl.top/auth（正确）
  #   → API 却变成 https://inurl.top/api/v3（静态站不提供 → 404 → 登录循环）
  # 解决：functions/api/v3/[[path]].js 把 /api/v3/* 反代到 https://api.github.com/*，使 API 调用通。
  base_url: https://inurl.top
  auth_endpoint: /auth
  # ⚠️ 你需手动 2 步（本环境无法改 Cloudflare/GitHub 设置）：
  #   1) Cloudflare Pages 项目 inurl-top → Settings → Environment variables（选 Production）添加：
  #        GITHUB_CLIENT_ID     = Ov23liJ4fvPrfXbIBSdq
  #        GITHUB_CLIENT_SECRET = 你的 GitHub OAuth App 密钥（在 GitHub OAuth App 页面查看）
  #   2) GitHub OAuth App 的 Authorization callback URL 改成：https://inurl.top/auth/callback
  #   （注意：之前设的 api.netlify.com/auth/callback 是错的，对 Cloudflare Pages 站点无效）

# 图片存放（对齐原 Typecho 的 usr/uploads）
media_folder: static/usr/uploads
public_folder: /usr/uploads

collections:
  - name: posts
    label: 文章
    folder: content/posts
    slug: "{{slug}}"
    create: true
    fields:
      - { name: title, label: 标题, widget: string, required: true }
      - { name: slug, label: 固定链接(slug), widget: string, required: true }
      - { name: date, label: 日期, widget: datetime }
      - { name: draft, label: 草稿, widget: boolean, default: true }
      - { name: description, label: 摘要, widget: text }
      - name: categories
        label: 分类
        widget: list
        field:
          name: cat
          label: 分类
          widget: select
          options:
            - { value: fuli, label: 福利 }
            - { value: yuanquan, label: 猿圈 }
      - name: tags
        label: 标签
        widget: list
        field:
          name: tag
          label: 标签
          widget: string
      - { name: body, label: 正文, widget: markdown }

  - name: pages
    label: 独立页面
    folder: content/pages
    slug: "{{slug}}"
    create: true
    fields:
      - { name: title, label: 标题, widget: string, required: true }
      - { name: slug, label: 固定链接(slug), widget: string, required: true }
      - { name: draft, label: 草稿, widget: boolean, default: false }
      - { name: body, label: 正文, widget: markdown }
