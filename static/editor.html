<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>顶级索引 · 文章后台</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="/editor.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11/styles/github.min.css">
</head>
<body>
  <!-- 登录遮罩 -->
  <div id="login-gate" class="gate">
    <div class="gate-card">
      <div class="logo">&#8984; 顶级索引</div>
      <h1>文章管理后台</h1>
      <p class="sub">用 GitHub 账号登录后，可直接读写仓库里的文章（content/*.md），保存即自动部署。</p>
      <button id="btn-login" class="btn-primary">使用 GitHub 登录</button>
      <p class="hint">登录即代表你授权本站在你的 GitHub 仓库上提交改动。</p>
    </div>
  </div>

  <!-- 主界面 -->
  <div id="app" class="app hidden">
    <header class="topbar">
      <div class="topbar-left">
        <div class="brand">&#8984; 顶级索引</div>
        <span class="brand-sep">/</span>
        <span class="brand-sub">文章后台</span>
        <button id="btn-logout" class="btn-ghost btn-sm" title="退出登录">退出</button>
      </div>
      <div class="topbar-right">
        <span id="user" class="user"></span>
        <button id="btn-new" class="btn btn-sm">＋ 新建</button>
        <button id="btn-savedraft" class="btn btn-sm">保存草稿</button>
        <button id="btn-publish" class="btn-primary btn-sm">发布</button>
      </div>
    </header>

    <main class="layout">
      <aside class="sidebar">
        <div class="search"><input id="search" type="text" placeholder="搜索文章标题…"></div>
        <ul id="post-list" class="post-list"></ul>
        <div id="list-loading" class="list-loading">加载中…</div>
      </aside>

      <section class="editor-pane">
        <div id="empty" class="empty">
          <div class="empty-inner">
            <div class="empty-ico">&#8984;</div>
            <p>从左侧选择一篇文章，或点击右上角「＋ 新建」开始。</p>
          </div>
        </div>

        <div id="editor" class="editor hidden">
          <div class="doc-head">
            <input id="f-title" class="title-input" type="text" placeholder="无标题">
            <div class="meta-row">
              <div class="mf">
                <span class="mf-label">发布路径</span>
                <input id="f-slug" class="mf-input" type="text" placeholder="archives/your-slug" readonly>
              </div>
              <div class="mf mf-grow">
                <span class="mf-label">标签</span>
                <div class="combo" id="combo-tags">
                  <div class="combo-box">
                    <span class="chips" id="chips-tags"></span>
                    <input id="f-tags-input" class="combo-input" type="text" placeholder="选择或输入标签，回车添加" autocomplete="off">
                  </div>
                  <input id="f-tags" type="hidden">
                  <ul class="combo-menu" id="menu-tags" hidden></ul>
                </div>
              </div>
              <div class="mf mf-grow">
                <span class="mf-label">分类</span>
                <div class="combo" id="combo-cats">
                  <div class="combo-box">
                    <span class="chips" id="chips-cats"></span>
                    <input id="f-cats-input" class="combo-input" type="text" placeholder="选择或输入分类，回车添加" autocomplete="off">
                  </div>
                  <input id="f-cats" type="hidden">
                  <ul class="combo-menu" id="menu-cats" hidden></ul>
                </div>
              </div>
              <div class="mf mf-cover">
                <span class="mf-label">封面图</span>
                <input id="f-cover" class="mf-input" type="text" placeholder="可空（/img/xxx.jpg）">
              </div>
              <div class="mf mf-date">
                <span class="mf-label">日期</span>
                <input id="f-date" class="mf-input" type="date">
              </div>
            </div>
          </div>

          <div class="toolbar" id="toolbar">
            <button class="tb" data-cmd="bold" title="加粗（Ctrl+B）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M7 5h5.5a3.5 3.5 0 0 1 0 7H7zM7 12h6a3.5 3.5 0 0 1 0 7H7z" fill="currentColor" stroke="none"/></svg></button>
            <button class="tb" data-cmd="italic" title="斜体（Ctrl+I）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><line x1="10" y1="6" x2="14" y2="6"/><line x1="10" y1="18" x2="14" y2="18"/><line x1="12" y1="6" x2="12" y2="18"/></svg></button>
            <button class="tb" data-cmd="h2" title="标题"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 6v12M19 6v12M5 12h14"/></svg></button>
            <span class="tb-sep"></span>
            <button class="tb" data-cmd="link" title="插入超链接（文字加链接）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a3.5 3.5 0 0 0 5 0l2-2a3.5 3.5 0 0 0-5-5l-1 1"/><path d="M14 10a3.5 3.5 0 0 0-5 0l-2 2a3.5 3.5 0 0 0 5 5l1-1"/></svg></button>
            <button class="tb" data-cmd="image" title="插入外链图片"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="14" rx="2"/><circle cx="9" cy="10" r="1.5" fill="currentColor" stroke="none"/><path d="M5 17l4.5-4.5 3 3L16 11l3 3"/></svg></button>
            <button class="tb" data-cmd="upload" title="上传本地图片到仓库并插入"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V8M9 11l3-3 3 3"/><path d="M5 18a3 3 0 0 1-.5-5.9A4.5 4.5 0 0 1 18 12.5 3.5 3.5 0 0 1 17 18z"/></svg></button>
            <span class="tb-sep"></span>
            <button class="tb" data-cmd="quote" title="引用块"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 7c-2.2 0-4 1.6-4 4v3h4v-4H7c0-1 .8-2 2-2zm8 0c-2.2 0-4 1.6-4 4v3h4v-4h-2c0-1 .8-2 2-2z"/></svg></button>
            <button class="tb" data-cmd="code" title="行内代码"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 8l-4 4 4 4M15 8l4 4-4 4"/></svg></button>
            <button class="tb" data-cmd="codeblock" title="代码块"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M9 10l-3 2 3 2M15 10l3 2-3 2"/></svg></button>
            <span class="tb-sep"></span>
            <button class="tb" data-cmd="ul" title="无序列表"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="5" cy="7" r="1.3" fill="currentColor" stroke="none"/><circle cx="5" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="5" cy="17" r="1.3" fill="currentColor" stroke="none"/><line x1="9" y1="7" x2="19" y2="7"/><line x1="9" y1="12" x2="19" y2="12"/><line x1="9" y1="17" x2="19" y2="17"/></svg></button>
            <button class="tb" data-cmd="ol" title="有序列表"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><text x="3" y="9" font-size="8" fill="currentColor" stroke="none">1</text><text x="3" y="16" font-size="8" fill="currentColor" stroke="none">2</text><line x1="9" y1="7" x2="19" y2="7"/><line x1="9" y1="14" x2="19" y2="14"/></svg></button>
          </div>

          <div class="edit-area" id="edit-area">
            <div class="edit-box" id="edit-box">
              <div id="gutter" class="gutter" aria-hidden="true"></div>
              <textarea id="body" spellcheck="false" placeholder="开始写作… 选中文字后点上方按钮即可加粗、插入链接 / 图片，无需手写 Markdown。"></textarea>
            </div>
            <div id="preview" class="preview markdown-body"></div>
          </div>

          <div class="edit-foot">
            <span id="status" class="status"></span>
            <div class="tabs">
              <button class="tab active" data-tab="split">分屏</button>
              <button class="tab" data-tab="write">仅编辑</button>
              <button class="tab" data-tab="preview">仅预览</button>
            </div>
            <button id="btn-del" class="btn-danger btn-sm">删除</button>
          </div>
        </div>
      </section>
    </main>

    <input id="img-input" type="file" accept="image/*" hidden>
    <div id="toast" class="toast"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11/build/highlight.min.js"></script>
  <script src="/editor.js"></script>
</body>
</html>
